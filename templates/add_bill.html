{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Add New Bill</h2>
<form method="post" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Customer Name</label>
    <input type="text" name="customer_name" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control">
  </div>
  <div class="col-md-6">
    <label class="form-label">Item Description</label>
    <input type="text" name="item_description" class="form-control" required>
  </div>
  <div class="col-md-2">
    <label class="form-label">Quantity</label>
    <input type="number" name="quantity" class="form-control" value="1" min="1">
  </div>
  <div class="col-md-4">
    <label class="form-label">Amount (₹)</label>
    <input type="number" step="0.01" name="amount" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Bill Date</label>
    <input type="date" name="bill_date" class="form-control" value="{{ today }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Due Date</label>
    <input type="date" name="due_date" class="form-control">
  </div>
  <div class="col-md-4">
    <label class="form-label">Payment Mode</label>
    <select name="payment_mode" class="form-select">
      <option>Cash</option>
      <option>UPI</option>
      <option>Card</option>
    </select>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Save Bill</button>
  </div>
</form>
{% endblock %}
